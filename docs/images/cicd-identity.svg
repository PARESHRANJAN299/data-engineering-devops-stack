<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
  <title id="t">How a human user and a service principal log in to Databricks</title>
  <desc id="d">You, a human user, log in through the Databricks CLI with a browser. GitHub Actions uses a service principal, a robot user with a client ID and secret stored in GitHub. Databricks authenticates the identity, then allows only the permissions granted to it, and then bundle validate and bundle deploy change the dev workspace. This is the planned CI/CD flow.</desc>
  <defs>
    <style>
      .bg{fill:#0d1117} .zone{fill:#11161d;stroke:#30363d} .node{fill:#161b22;stroke:#30363d;stroke-width:1.5}
      .zlab{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e;letter-spacing:2px}
      .title{font:700 16px "Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}
      .sub{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e} .edge{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#7d8590}
      .body{font:12px "Segoe UI",Helvetica,Arial,sans-serif;fill:#9da7b3}
      .flow{fill:none;stroke:#3d444d;stroke-width:2}
      .run{fill:none;stroke:#58a6ff;stroke-width:2;stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
      .robot{fill:none;stroke:#3fb950;stroke-width:2;stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes dash{to{stroke-dashoffset:-28}}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    </style>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect class="bg" width="960" height="560" rx="18"/>

  <!-- band 1 -->
  <rect class="zone" x="20" y="20" width="920" height="214" rx="14"/>
  <text class="zlab" x="40" y="44">1 · WHO IS LOGGING IN</text>

  <path class="flow" d="M244,95 H300"/><path class="run" d="M244,95 H300"/>
  <path class="flow" d="M244,185 H300"/><path class="robot" d="M244,185 H300"/>
  <path class="flow" d="M510,95 C575,95 575,125 640,125"/><path class="run" d="M510,95 C575,95 575,125 640,125"/>
  <path class="flow" d="M510,185 C575,185 575,155 640,155"/><path class="robot" d="M510,185 C575,185 575,155 640,155"/>
  <text class="edge" x="272" y="84" text-anchor="middle">uses</text>
  <text class="edge" x="272" y="174" text-anchor="middle">uses</text>
  <text class="edge" x="560" y="80" text-anchor="middle">browser login</text>
  <text class="edge" x="560" y="212" text-anchor="middle">client ID + secret</text>

  <g><rect class="node" x="44" y="60" width="200" height="70" rx="12"/><rect x="44" y="72" width="5" height="46" rx="2.5" fill="#58a6ff"/><text class="title" x="66" y="88">You</text><text class="sub" x="66" y="108">human user</text></g>
  <g><rect class="node" x="300" y="60" width="210" height="70" rx="12"/><rect x="300" y="72" width="5" height="46" rx="2.5" fill="#58a6ff"/><text class="title" x="322" y="88">Databricks CLI</text><text class="sub" x="322" y="108">on EC2 · OAuth dev profile</text></g>
  <g><rect class="node" x="44" y="150" width="200" height="70" rx="12"/><rect x="44" y="162" width="5" height="46" rx="2.5" fill="#3fb950"/><text class="title" x="66" y="178">GitHub Actions</text><text class="sub" x="66" y="198">runs the workflow</text></g>
  <g><rect class="node" x="300" y="150" width="210" height="70" rx="12"/><rect x="300" y="162" width="5" height="46" rx="2.5" fill="#3fb950"/><text class="title" x="322" y="178">Service Principal</text><text class="sub" x="322" y="198">robot user · GitHub secret</text></g>
  <g class="pulse" filter="url(#glow)"><rect class="node" x="640" y="90" width="270" height="100" rx="12"/><rect x="640" y="108" width="5" height="64" rx="2.5" fill="#ff3621"/><text class="title" x="662" y="122">Databricks</text><text class="sub" x="662" y="144">checks who is calling</text><text class="sub" x="662" y="162">(authentication)</text></g>

  <!-- band 2 -->
  <rect class="zone" x="20" y="254" width="920" height="196" rx="14"/>
  <text class="zlab" x="40" y="278">2 · WHAT THAT IDENTITY MAY DO</text>

  <path class="flow" d="M775,190 V300"/><path class="run" d="M775,190 V300"/>
  <path class="flow" d="M640,355 H570"/><path class="run" d="M640,355 H570"/>
  <path class="flow" d="M330,355 H274"/><path class="run" d="M330,355 H274"/>
  <text class="edge" x="785" y="250">identity known</text>
  <text class="edge" x="605" y="345" text-anchor="middle">allowed</text>
  <text class="edge" x="302" y="345" text-anchor="middle">changes</text>

  <g><rect class="node" x="640" y="305" width="270" height="100" rx="12"/><rect x="640" y="323" width="5" height="64" rx="2.5" fill="#d29922"/><text class="title" x="662" y="338">Permissions</text><text class="sub" x="662" y="360">only what was granted</text><text class="sub" x="662" y="378">(authorization)</text></g>
  <g><rect class="node" x="330" y="305" width="240" height="100" rx="12"/><rect x="330" y="323" width="5" height="64" rx="2.5" fill="#58a6ff"/><text class="title" x="352" y="338">bundle commands</text><text class="sub" x="352" y="360">validate = check only</text><text class="sub" x="352" y="378">deploy = change workspace</text></g>
  <g><rect class="node" x="44" y="305" width="230" height="100" rx="12"/><rect x="44" y="323" width="5" height="64" rx="2.5" fill="#a371f7"/><text class="title" x="66" y="338">Dev workspace</text><text class="sub" x="66" y="360">pipeline and jobs</text><text class="sub" x="66" y="378">updated from the repo</text></g>

  <!-- legend -->
  <rect class="zone" x="20" y="470" width="920" height="70" rx="14"/>
  <circle cx="48" cy="494" r="6" fill="#58a6ff"/><text class="body" x="64" y="498">You = human user. Logs in with a browser and can do what you can do.</text>
  <circle cx="48" cy="520" r="6" fill="#3fb950"/><text class="body" x="64" y="524">Service Principal = robot user. No browser; logs in with a secret and can do only what it is granted.</text>
</svg>
